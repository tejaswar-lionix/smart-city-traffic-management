version: '3.8'
services:
  db:
    image: postgres:15
    environment: {POSTGRES_DB: smart_city, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    ports: ["8000:8000"]
    depends_on: [db, redis]
    environment: {USE_SQLITE: 0, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0}
  frontend:
    build:
      context: ./frontend
    ports: ["3000:3000"]
